name: Update calendar

on:
  schedule:
        - cron: '7,22,37,52 * * * *'   # every 15 minutes, off the busy top of the hour
  workflow_dispatch:          # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download calendar feed
        run: |
          curl -fsSL "https://calendar.google.com/calendar/ical/c_7c8b7d33d8465f79c97c8d1d0435c3f2c1790951557683e76d1e07b6e459b50d%40group.calendar.google.com/public/basic.ics" -o calendar.tmp
          # DTSTAMP changes on every download; drop it so we only commit real changes
          grep -v '^DTSTAMP:' calendar.tmp > calendar.ics
          rm calendar.tmp

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          git diff --cached --quiet || (git commit -m "Update calendar" && git push)
